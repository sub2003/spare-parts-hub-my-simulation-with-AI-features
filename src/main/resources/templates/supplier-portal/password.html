<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Change Password - Supplier Portal</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/><link rel="stylesheet" th:href="@{/css/app-shell.css}"/><link rel="stylesheet" th:href="@{/css/supplier-portal.css}"/></head>
<body class="portal-body"><nav class="portal-nav"><div class="portal-nav-inner"><div class="portal-brand-wrap"><img th:src="@{/images/spare-parts-hub-logo.svg}" alt="Spare Parts Hub"/><span class="portal-label">Supplier Portal</span></div><a class="btn btn-sm btn-light" th:href="@{/supplier-portal/profile}">Back to Profile</a></div></nav>
<main class="portal-page"><header class="page-head"><div><div class="eyebrow">Account Security</div><h1 class="page-title">Change Password</h1><p class="page-subtitle">Your current password is verified before the new BCrypt password is stored.</p></div></header><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<section class="form-card" style="max-width:620px"><form method="post" th:action="@{/supplier-portal/profile/password}"><div class="mb-3"><label class="form-label" for="currentPassword">Current Password</label><input id="currentPassword" class="form-control" type="password" name="currentPassword" autocomplete="current-password" required/></div><div class="mb-3"><label class="form-label" for="newPassword">New Password</label><input id="newPassword" class="form-control" type="password" name="newPassword" minlength="8" autocomplete="new-password" required/><div class="form-text">Use at least 8 characters.</div></div><div class="mb-4"><label class="form-label" for="confirmPassword">Confirm New Password</label><input id="confirmPassword" class="form-control" type="password" name="confirmPassword" minlength="8" autocomplete="new-password" required/></div><div class="d-flex justify-content-end gap-2"><a class="btn btn-light" th:href="@{/supplier-portal/profile}">Cancel</a><button class="btn btn-primary" type="submit">Change Password</button></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/app.js}"></script></body></html>
