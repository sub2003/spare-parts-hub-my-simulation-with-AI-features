<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(title='Change Password', content=~{::main})}">
<body>
<main class="page-wrap">
    <header class="page-head">
        <div>
            <div class="eyebrow">Account Security</div>
            <h1 class="page-title">Change Password</h1>
            <p class="page-subtitle">Verify your current password before choosing a new password.</p>
        </div>
        <a class="btn btn-light" th:href="@{/profile}">Back to Profile</a>
    </header>

    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

    <section class="form-card" style="max-width:620px">
        <form method="post" th:action="@{/profile/password}">
            <div class="mb-3">
                <label class="form-label" for="currentPassword">Current Password</label>
                <input id="currentPassword" class="form-control" type="password" name="currentPassword"
                       autocomplete="current-password" required/>
            </div>
            <div class="mb-3">
                <label class="form-label" for="newPassword">New Password</label>
                <input id="newPassword" class="form-control" type="password" name="newPassword"
                       minlength="8" autocomplete="new-password" required/>
                <div class="form-text">Use at least 8 characters.</div>
            </div>
            <div class="mb-4">
                <label class="form-label" for="confirmPassword">Confirm New Password</label>
                <input id="confirmPassword" class="form-control" type="password" name="confirmPassword"
                       minlength="8" autocomplete="new-password" required/>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <a class="btn btn-light" th:href="@{/profile}">Cancel</a>
                <button class="btn btn-primary" type="submit">Change Password</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
