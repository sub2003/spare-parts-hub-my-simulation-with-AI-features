spring.application.name=spare-parts-hub-simulation

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/spareparts_mysimulation1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Optional internal AI demand forecasting service
ai.forecast.enabled=${AI_FORECAST_ENABLED:true}
ai.forecast.base-url=${AI_FORECAST_BASE_URL:http://127.0.0.1:8000}
ai.forecast.timeout-ms=${AI_FORECAST_TIMEOUT_MS:10000}

# Weekly Sunday 02:00 retraining request
ai.forecast.scheduled-retraining=${AI_FORECAST_SCHEDULED_RETRAINING:true}
ai.forecast.retrain-cron=${AI_FORECAST_RETRAIN_CRON:0 0 2 * * SUN}

# Railway provides PORT automatically
server.port=${PORT:8080}