spring.application.name=spare-parts-hub-simulation

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/spareparts_mysimulation1
spring.datasource.username=root
spring.datasource.password=Subhanu

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Optional internal AI demand forecasting service (demo/academic feature)
ai.forecast.enabled=true
ai.forecast.base-url=http://127.0.0.1:8000
ai.forecast.timeout-ms=10000
# Weekly Sunday 02:00 retraining request. The active model stays in service until a candidate passes evaluation.
ai.forecast.scheduled-retraining=true
ai.forecast.retrain-cron=0 0 2 * * SUN
